<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulir Pendaftaran Anggota Baru</title>
  <!-- Menggunakan Font Awesome untuk ikon input -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background-color: #f4f6f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    /* Container utama formulir */
    .form-container {
      background-color: #e8f1f8;
      border: 1px solid #b8d4e3;
      border-radius: 8px;
      padding: 24px 30px;
      width: 480px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
    }

    .form-title {
      font-size: 1.25rem;
      font-weight: bold;
      color: #1a365d;
      margin-top: 0;
      margin-bottom: 20px;
      text-align: left;
    }

    /* Group tiap baris formulir */
    .form-group {
      display: flex;
      align-items: center;
      margin-bottom: 16px;
    }

    .form-group-vertical {
      margin-bottom: 16px;
    }

    label.field-label {
      width: 140px;
      font-weight: bold;
      color: #333333;
      font-size: 0.9rem;
    }

    /* Input dengan ikon */
    .input-wrapper {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-wrapper i {
      position: absolute;
      left: 10px;
      color: #666666;
      font-size: 0.9rem;
    }

    .input-wrapper input[type="text"],
    .input-wrapper input[type="email"],
    .input-wrapper input[type="password"] {
      width: 100%;
      padding: 8px 10px 8px 32px;
      border: 1px solid #7ea7c5;
      border-radius: 6px;
      font-size: 0.9rem;
      outline: none;
      background-color: #ffffff;
    }

    .input-wrapper input:focus, select:focus {
      border-color: #2b6cb0;
      box-shadow: 0 0 4px rgba(43, 108, 176, 0.4);
    }

    /* Bagian Radio & Checkbox */
    .section-label {
      font-weight: bold;
      color: #333333;
      font-size: 0.9rem;
      margin-bottom: 8px;
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px 12px;
      margin-bottom: 16px;
      font-size: 0.88rem;
      color: #2d3748;
    }

    .options-grid-3 {
      display: grid;
      grid-template-columns: repeat(3, auto);
      justify-content: start;
      gap: 8px 16px;
      margin-bottom: 16px;
      font-size: 0.88rem;
      color: #2d3748;
    }

    .option-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .option-item input {
      cursor: pointer;
    }

    /* Dropdown Select */
    select.select-box {
      width: 180px;
      padding: 7px 10px;
      border: 1px solid #7ea7c5;
      border-radius: 6px;
      background-color: #ffffff;
      font-size: 0.9rem;
      color: #333333;
      outline: none;
      cursor: pointer;
    }

    /* Tombol Submit */
    .submit-container {
      margin-top: 24px;
    }

    .btn-submit {
      background-color: #319795;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      padding: 10px 20px;
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .btn-submit:hover {
      background-color: #277977;
    }
  </style>
</head>
<body>

  <div class="form-container">
    <h2 class="form-title">Formulir Pendaftaran Anggota Baru</h2>

    <form action="#" method="POST">
      <!-- Nama Lengkap -->
      <div class="form-group">
        <label class="field-label" for="nama">Nama Lengkap:</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-i-cursor"></i>
          <input type="text" id="nama" name="nama" placeholder="isi nama Anda">
        </div>
      </div>

      <!-- Alamat Email -->
      <div class="form-group">
        <label class="field-label" for="email">Alamat Email:</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-user"></i>
          <input type="email" id="email" name="email" placeholder="nama@email.com">
        </div>
      </div>

      <!-- Kata Sandi -->
      <div class="form-group">
        <label class="field-label" for="password">Kata Sandi:</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-lock"></i>
          <input type="password" id="password" name="password" placeholder="••••••••••••">
        </div>
      </div>

      <!-- Pilih Minat Utama -->
      <div class="form-group-vertical">
        <div class="section-label">Pilih Minat Utama (Satu):</div>
        <div class="options-grid">
          <label class="option-item">
            <input type="radio" name="minat" value="web" checked> Pengembangan Web
          </label>
          <label class="option-item">
            <input type="radio" name="minat" value="desain"> Desain Grafis
          </label>
          <label class="option-item">
            <input type="radio" name="minat" value="kriptografi"> Kriptografi
          </label>
          <label class="option-item">
            <input type="radio" name="minat" value="analis"> Analis Data
          </label>
        </div>
      </div>

      <!-- Area Keahlian -->
      <div class="form-group-vertical">
        <div class="section-label">Area Keahlian (Pilih semua yang sesuai):</div>
        <!-- Baris 1: 3 elemen -->
        <div class="options-grid-3">
          <label class="option-item">
            <input type="checkbox" name="keahlian" value="html_css"> HTML/CSS
          </label>
          <label class="option-item">
            <input type="checkbox" name="keahlian" value="js_node" checked> JavaScript/Node.js
          </label>
          <label class="option-item">
            <input type="checkbox" name="keahlian" value="python" checked> Python
          </label>
        </div>
        <!-- Baris 2: 2 elemen -->
        <div class="options-grid">
          <label class="option-item">
            <input type="checkbox" name="keahlian" value="ui_ux"> Desain UI/UX
          </label>
          <label class="option-item">
            <input type="checkbox" name="keahlian" value="pemasaran"> Pemasaran Digital
          </label>
        </div>
      </div>

      <!-- Negara Asal -->
      <div class="form-group">
        <label class="field-label" for="negara">Negara Asal:</label>
        <select id="negara" name="negara" class="select-box">
          <option value="" disabled selected hidden>Pilih Negara | v</option>
          <option value="indonesia">Indonesia</option>
          <option value="malaysia">Malaysia</option>
          <option value="singapura">Singapura</option>
        </select>
      </div>

      <!-- Tombol Submit -->
      <div class="submit-container">
        <button type="submit" class="btn-submit">[Daftar Sekarang]</button>
      </div>
    </form>
  </div>

</body>
</html>
